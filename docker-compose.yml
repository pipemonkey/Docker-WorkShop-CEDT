services:
  web:
    # Step 5a: build locally and expose the application.
    build: .
    ports:
      - "3000:3000"

    # Step 5b: load the database connection URL from .env.
    environment:
      DATABASE_URL: ${DATABASE_URL}

    # Step 5c: wait for database health before starting web.
    depends_on:
      db:
        condition: service_healthy

  db:
    # Step 5d: run Postgres with a readiness check.
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workshop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

    # Steps 5e and 5g: persist data and seed on first initialization.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # Step 5f: create the workshop database and user.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workshop

# Step 5h: declare the persistent database volume.
volumes:
  pgdata:
